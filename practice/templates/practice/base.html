{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}UGC NET Paper 1 Practice{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{% static 'practice/styles.css' %}?v=5" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div class="brand-wrap">
          <a href="{% url 'home' %}" class="brand">UGC NET Paper 1 Practice</a>
        </div>
        <nav class="top-nav">
          <a href="{% url 'home' %}">Home</a>
        </nav>
      </header>

      <main class="main-content">
        {% block content %}{% endblock %}
      </main>
    </div>

    <script src="{% static 'practice/app.js' %}"></script>
    {% block extra_js %}{% endblock %}
  </body>
</html>
